<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Một ngôi sao băng</title>
<meta name="description" content="Mở lúc trời tối nhé ✦">
<meta property="og:title" content="✦">
<meta property="og:description" content="Mở lúc trời tối nhé">
<meta property="og:type" content="website">
<!-- Ảnh xem trước khi dán link vào Zalo/Messenger (tuỳ chọn):
     đặt preview.png cùng thư mục rồi bỏ comment dòng dưới, sửa đúng đường dẫn.
<meta property="og:image" content="https://andang241.github.io/nguoila/preview.png"> -->
<meta name="theme-color" content="#02030a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Dancing+Script:wght@700&display=swap">
<style>
  /* Một bầu trời đêm phủ kín màn hình; chữ DOM chỉ là vài dòng nhỏ, nghiêng, nằm sát đáy */
  :root {
    --night: #02030a;
    --ink: #f3e9da;
    --ink-soft: rgba(243, 233, 218, 0.66);
    --ink-faint: rgba(243, 233, 218, 0.4);
    --glow: #ffd9a8;
    --font-note: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--night);
    color: var(--ink);
    font-family: var(--font-note);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

  .intro {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    cursor: pointer; outline: none;
    font-style: italic; font-size: clamp(19px, 1.1vw + 15px, 26px); letter-spacing: 0.02em;
    color: var(--ink-soft);
    transition: opacity 1.1s ease;
  }
  .intro .spark {
    font-style: normal; font-size: 1.15em; color: var(--glow);
    text-shadow: 0 0 14px var(--glow);
    animation: breathe 2.8s ease-in-out infinite;
  }
  .intro:focus-visible #introText { text-decoration: underline; text-underline-offset: 6px; }
  .intro.gone { opacity: 0; pointer-events: none; }
  @keyframes breathe {
    0%, 100% { opacity: 0.45; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  .footer {
    position: fixed; left: 0; right: 0; top: 70%; margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center; text-wrap: balance;
    font-style: italic; font-size: clamp(18px, 1vw + 14px, 25px); letter-spacing: 0.01em;
    color: var(--ink-soft);
    opacity: 0; transition: opacity 2.2s ease; pointer-events: none;
  }
  .hint {
    position: fixed; left: 0; right: 0; margin: 0;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-style: italic; font-size: 16px; color: var(--ink-faint);
    opacity: 0; transition: opacity 2s ease; pointer-events: none;
  }
  .replay {
    position: fixed;
    right: max(12px, env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding: 8px 8px; border: 0; border-radius: 6px; background: none;
    font: italic 16px var(--font-note); color: var(--ink-faint); cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 2s ease, color 0.3s ease;
  }
  .replay:hover { color: var(--ink-soft); }
  .replay:focus-visible { outline: 1px solid var(--ink-faint); outline-offset: 2px; }
  .show { opacity: 1; }
  .replay.show { pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .intro .spark { animation: none; } }
</style>
</head>
<body>
<canvas id="sky" aria-label="Bầu trời đêm, một ngôi sao băng hoá thành pháo hoa rồi thành chữ"></canvas>
<div id="intro" class="intro" role="button" tabindex="0">
  <span class="spark" aria-hidden="true">✦</span>
  <span id="introText"></span>
</div>
<p id="footer" class="footer"></p>
<p id="hint" class="hint"></p>
<button id="replay" class="replay" type="button"></button>

<script>
(() => {
  'use strict';

  /* ================= Sửa nội dung ở đây ================= */
  const CONFIG = {
    intro: 'chạm vào đây nhé',
    words: ['Người', 'lạ', 'quen'], // chữ thứ hai bị gạch, chữ thứ ba viết thay vào
    footer: '',                     // một câu nhỏ hiện dưới chữ ở cuối; để trống thì không hiện
    hint: 'chạm vào bầu trời ✦',
    replay: 'xem lại',
    music: '',                      // ví dụ 'nhac.mp3' đặt cùng thư mục; để trống = không có nhạc
  };
  /* ====================================================== */

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const easeInOut = (t) => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // Nhịp (giây). Từ "hover" trở đi tính từ lúc pháo hoa nổ.
  const TL = {
    meteorStart: 0.9, entry: 3.2, spiral: 6.0, inhale: 0.8,
    hover: 2.5, gather: 3.3, glyphIn: 5.3,
    strike: 7.2, strikeDur: 0.6,
    shift: 8.2, shiftDur: 1.1,
    pen: 9.5, penDur: 1.8, penFly: 1.4,
    end: 12.4,
  };

  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const bgc = document.createElement('canvas');
  const mctx = document.createElement('canvas').getContext('2d');
  const introEl = document.getElementById('intro');
  const footerEl = document.getElementById('footer');
  const hintEl = document.getElementById('hint');
  const replayEl = document.getElementById('replay');
  document.getElementById('introText').textContent = CONFIG.intro;
  introEl.setAttribute('aria-label', CONFIG.intro);
  hintEl.textContent = CONFIG.hint;
  replayEl.textContent = CONFIG.replay;

  const FONT = '"Dancing Script", "Segoe Script", Georgia, serif';
  const fontStr = (px) => `700 ${px.toFixed(1)}px ${FONT}`;

  let W = 0, H = 0, DPR = 1, D = 1, U = 1, CX = 0, CY = 0;

  /* ---------- sprite phát sáng ---------- */
  const COLORS = {
    white: [236, 242, 255], warm: [255, 228, 196], gold: [255, 206, 140],
    rose: [255, 150, 186], peach: [255, 186, 168], sky: [150, 202, 255],
    lilac: [198, 170, 255], cool: [140, 162, 214],
  };
  const RGB = {};
  const SPR = {};
  for (const k in COLORS) {
    const [r, g, b] = COLORS[k];
    RGB[k] = `${r},${g},${b}`;
    const n = 64, c = document.createElement('canvas');
    c.width = c.height = n;
    const x = c.getContext('2d'), h = n / 2;
    const gr = x.createRadialGradient(h, h, 0, h, h, h);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.1, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(0.24, `rgba(${r},${g},${b},0.42)`);
    gr.addColorStop(0.5, `rgba(${r},${g},${b},0.09)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr;
    x.fillRect(0, 0, n, n);
    SPR[k] = c;
  }
  const mix = (a, b, t) => `${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))}`;

  /* ---------- trạng thái ---------- */
  const fresh = () => ({
    started: false, ended: false, tapped: false, T: 0, clock: 0,
    m: { s: 0, v: 0, sn: 0, on: false, arrived: false, tA: 0, emit: 0 },
    tB: Infinity, skyAngle: 0, skySpin: 0, flash: 0, shake: 0,
    parts: [], sparks: [], meteors: [], timers: [],
    text: null, off: 0, hoverOn: false, gatherOn: false,
    penT: [], penPtr: 0, penStar: false, nextAmbient: Infinity,
  });
  let S = fresh();
  let FREEZE = false;
  const DEBUG = new URLSearchParams(location.search).has('debug');
  const later = (dt, f) => S.timers.push({ t: S.T + dt, f });

  /* ---------- nền + sao ---------- */
  function paintBg() {
    const b = bgc.getContext('2d');
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = b.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#02030a');
    g.addColorStop(0.5, '#060a1c');
    g.addColorStop(0.86, '#0e0e2c');
    g.addColorStop(1, '#191236');
    b.fillStyle = g;
    b.fillRect(0, 0, W, H);
    const r = b.createRadialGradient(W * 0.5, H * 1.08, 0, W * 0.5, H * 1.08, Math.max(W, H) * 0.75);
    r.addColorStop(0, 'rgba(150,92,172,0.2)');
    r.addColorStop(1, 'rgba(150,92,172,0)');
    b.fillStyle = r;
    b.fillRect(0, 0, W, H);
  }

  let stars = [];
  const STAR_COLS = ['236,242,255', '200,214,255', '255,236,214'];
  function makeStars() {
    const R = Math.hypot(Math.max(CX, W - CX), Math.max(CY, H - CY)) + 8;
    const n = Math.min(1100, Math.round(Math.PI * R * R / 1700));
    const keep = stars.filter((s) => s.mine);
    stars = [];
    for (let i = 0; i < n; i++) {
      const s = Math.pow(Math.random(), 2.4);
      const col = STAR_COLS[(Math.random() * 3) | 0];
      stars.push({
        r: R * Math.sqrt(Math.random()), th: Math.random() * TAU,
        sz: 0.4 + s * 1.5, a: 0.18 + 0.62 * Math.random() * (0.5 + 0.5 * s) + 0.2 * s,
        tw: rand(0.5, 2.4), ph: rand(0, TAU), rgb: `rgb(${col})`, big: s > 0.55,
      });
    }
    stars.push(...keep);
  }

  function drawStars(dim) {
    const arc = reduce ? 0 : Math.min(0.75, S.skySpin * 0.42);
    const clock = S.clock;
    if (arc > 0.004) {
      ctx.lineCap = 'round';
      for (const s of stars) {
        const a1 = s.th + S.skyAngle;
        const x = CX + s.r * Math.cos(a1), y = CY + s.r * Math.sin(a1);
        const mg = s.r * arc + 4;
        if (x < -mg || x > W + mg || y < -mg || y > H + mg) continue;
        ctx.globalAlpha = s.a * dim * 0.7 * (0.75 + 0.25 * Math.sin(clock * s.tw + s.ph));
        ctx.strokeStyle = s.rgb;
        ctx.lineWidth = s.sz;
        ctx.beginPath();
        ctx.arc(CX, CY, s.r, a1 - arc, a1);
        ctx.stroke();
      }
    }
    const headA = arc > 0.004 ? 1 - smooth(arc / 0.25) : 1;
    if (headA > 0.01) {
      for (const s of stars) {
        const a1 = s.th + S.skyAngle;
        const x = CX + s.r * Math.cos(a1), y = CY + s.r * Math.sin(a1);
        if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
        const tw = 0.6 + 0.4 * Math.sin(clock * s.tw + s.ph);
        ctx.globalAlpha = s.a * dim * tw * headA;
        if (s.big) {
          const z = s.sz * 7;
          ctx.drawImage(s.mine ? SPR.warm : SPR.white, x - z, y - z, 2 * z, 2 * z);
        } else {
          ctx.fillStyle = s.rgb;
          ctx.fillRect(x - s.sz / 2, y - s.sz / 2, s.sz, s.sz);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- quỹ đạo sao băng: đường vào + xoắn ốc vào tâm ---------- */
  const path = { xs: null, ys: null, cum: null, n: 0, L: 1, Le: 1, Ls: 1, v0: 1, k: 2, ek: Math.exp(2) };
  function solveK(target) {
    if (target >= 0.999) return 0.01;
    let lo = 0.01, hi = 12;
    for (let i = 0; i < 50; i++) {
      const mid = (lo + hi) / 2;
      if ((1 - Math.exp(-mid)) / mid > target) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  function buildPath() {
    const ax = 0.4 * W, ay = Math.min(0.38 * H, ax * 1.7);
    const a0 = -Math.PI / 2 + 0.2, A = TAU * 2.25;
    const sp = (u) => {
      const a = a0 + A * u, f = Math.pow(1 - u, 1.2);
      return [CX + ax * f * Math.cos(a), CY + ay * f * Math.sin(a)];
    };
    const s0 = sp(0), s1 = sp(0.0005);
    let dx = s1[0] - s0[0], dy = s1[1] - s0[1];
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    let lin = 0;
    while (lin < 4 * D) {
      const x = s0[0] - dx * lin, y = s0[1] - dy * lin;
      if (x < 0 || x > W || y < 0 || y > H) break;
      lin += 4;
    }
    lin += 50 * U;
    const ux = dy, uy = -dx;
    const P0 = [s0[0] - dx * lin + ux * 0.16 * lin, s0[1] - dy * lin + uy * 0.16 * lin];
    const K = [s0[0] - dx * lin * 0.5, s0[1] - dy * lin * 0.5];
    const NE = 240, NS = 2400, n = NE + NS + 1;
    const xs = new Float32Array(n), ys = new Float32Array(n), cum = new Float32Array(n);
    for (let i = 0; i < NE; i++) {
      const t = i / NE, m = 1 - t;
      xs[i] = m * m * P0[0] + 2 * m * t * K[0] + t * t * s0[0];
      ys[i] = m * m * P0[1] + 2 * m * t * K[1] + t * t * s0[1];
    }
    for (let i = 0; i <= NS; i++) {
      const p = sp(i / NS);
      xs[NE + i] = p[0];
      ys[NE + i] = p[1];
    }
    for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]);
    const oldL = path.L;
    path.xs = xs; path.ys = ys; path.cum = cum; path.n = n;
    path.L = cum[n - 1]; path.Le = cum[NE]; path.Ls = path.L - path.Le;
    path.v0 = Math.max(path.Le / TL.entry, 0.21 * D);
    path.k = clamp(solveK(TL.spiral * path.v0 / path.Ls), 1.4, 3.4);
    path.ek = Math.exp(path.k);
    return oldL;
  }
  function pathAt(s, out) {
    const { cum, xs, ys, n } = path;
    if (s <= 0) { out.x = xs[0]; out.y = ys[0]; return out; }
    if (s >= cum[n - 1]) { out.x = xs[n - 1]; out.y = ys[n - 1]; return out; }
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] < s) lo = mid; else hi = mid; }
    const t = (s - cum[lo]) / (cum[hi] - cum[lo] || 1);
    out.x = xs[lo] + (xs[hi] - xs[lo]) * t;
    out.y = ys[lo] + (ys[hi] - ys[lo]) * t;
    return out;
  }
  const speedAt = (s) => (s < path.Le ? path.v0 : path.v0 * Math.exp(path.k * (s - path.Le) / path.Ls));
  const normAt = (s) => (s < path.Le ? 0 : (Math.exp(path.k * (s - path.Le) / path.Ls) - 1) / (path.ek - 1));

  /* ---------- chữ ---------- */
  function glyph(word, F, fill, glow) {
    mctx.font = fontStr(F);
    const w = mctx.measureText(word).width, pad = F * 0.5;
    const cw = w + pad * 2, ch = F * 2.2;
    const c = document.createElement('canvas');
    c.width = Math.ceil(cw * DPR);
    c.height = Math.ceil(ch * DPR);
    const g = c.getContext('2d');
    g.scale(DPR, DPR);
    g.font = fontStr(F);
    g.textBaseline = 'alphabetic';
    g.fillStyle = fill;
    g.shadowColor = glow;
    g.shadowBlur = F * 0.3;
    g.fillText(word, pad, F * 1.4);
    g.shadowBlur = F * 0.08;
    g.fillText(word, pad, F * 1.4);
    return { c, ox: -pad, oy: -F * 1.4, w: c.width / DPR, h: c.height / DPR };
  }
  function layoutText() {
    const t = S.text;
    if (!t) return;
    const [w1, w2, w3] = CONFIG.words;
    const full = `${w1} ${w2} ${w3}`;
    mctx.font = fontStr(100);
    const wf = mctx.measureText(full).width || 500;
    const F = clamp(Math.min((0.84 * W) / wf * 100, 0.16 * H), 24, 150);
    mctx.font = fontStr(F);
    const tw = mctx.measureText(full).width;
    const x0 = CX - tw / 2;
    t.F = F;
    t.xN = x0;
    t.xL = x0 + mctx.measureText(`${w1} `).width;
    t.xQ = x0 + mctx.measureText(`${w1} ${w2} `).width;
    t.off0 = (tw - mctx.measureText(`${w1} ${w2}`).width) / 2;
    t.wL = mctx.measureText(w2).width / F;
    t.wQ = mctx.measureText(w3).width / F;
    t.xh = (mctx.measureText('x').actualBoundingBoxAscent || F * 0.42) / F;
    t.base = CY + F * 0.3;
    t.G = [
      glyph(w1, F, 'rgb(255,238,216)', 'rgba(255,190,120,0.95)'),
      glyph(w2, F, 'rgb(255,238,216)', 'rgba(255,190,120,0.95)'),
      glyph(w3, F, 'rgb(255,226,216)', 'rgba(255,140,150,0.95)'),
    ];
    footerEl.style.top = `${t.base + F * 0.85}px`;
  }
  function sampleWord(word, F, step) {
    mctx.font = fontStr(F);
    const w = Math.ceil(mctx.measureText(word).width + F * 0.6), h = Math.ceil(F * 1.9);
    const ox = F * 0.3, oy = F * 1.25;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.font = fontStr(F);
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#fff';
    g.fillText(word, ox, oy);
    const d = g.getImageData(0, 0, w, h).data;
    const pts = [];
    let row = 0;
    for (let y = step / 2; y < h; y += step * 0.866, row++) {
      for (let x = (row % 2 ? step / 2 : 0) + step / 4; x < w; x += step) {
        if (d[((y | 0) * w + (x | 0)) * 4 + 3] > 120) {
          pts.push({ ex: (x - ox + rand(-0.2, 0.2) * step) / F, ey: (y - oy + rand(-0.2, 0.2) * step) / F });
        }
      }
    }
    return pts;
  }
  function prepareText() {
    S.text = {};
    layoutText();
    const t = S.text, F = t.F, step = clamp(F / 19, 2.3, 7);
    t.P = CONFIG.words.map((w) => sampleWord(w, F, step));
    t.dotEm = (step * 2.6) / F;
    S.penT = t.P[2].slice().sort((a, b) => a.ex - b.ex);
    S.penPtr = 0;
    const lx = t.P[1].map((q) => q.ex);
    t.lMin = lx.length ? Math.min(...lx) : 0;
    t.lMax = lx.length ? Math.max(...lx) : t.wL;
    t.qMin = S.penT.length ? Math.min(-0.12, S.penT[0].ex - 0.04) : -0.12;
    t.qMax = S.penT.length ? Math.max(t.wQ, S.penT[S.penT.length - 1].ex) + 0.05 : t.wQ + 0.05;
    S.off = t.off0;
  }
  function targetOf(p, out) {
    const t = S.text;
    const ox = p.grp === 0 ? t.xN : p.grp === 1 ? t.xL : t.xQ;
    out[0] = ox + S.off + p.ex * t.F;
    out[1] = t.base + p.ey * t.F;
  }
  function strikePt(u, out) {
    const t = S.text, y0 = -t.xh * 0.5;
    const ex = lerp(t.lMin - 0.06, t.lMax + 0.06, u);
    const ey = lerp(y0 + 0.035, y0 - 0.045, u) - 0.03 * Math.sin(Math.PI * u);
    out.x = t.xL + S.off + ex * t.F;
    out.y = t.base + ey * t.F;
    return out;
  }
  function penPt(tb, out) {
    const t = S.text, u = win(tb, TL.pen, TL.pen + TL.penDur);
    const ex = lerp(t.qMin, t.qMax, u);
    const ey = -t.xh * 0.5 + 0.3 * Math.sin(u * TAU * 2.4 + 0.6);
    out.x = t.xQ + S.off + ex * t.F;
    out.y = t.base + ey * t.F;
    return out;
  }
  const penHome = () => ({ x: CX + 0.3 * W, y: 0.13 * H });

  /* ---------- hạt ---------- */
  const mkPart = (x, y, vx, vy, spr, sz, mode, main) => ({
    x, y, vx, vy, age: 0, b: 1, spr, sz, sz0: sz, mode, main,
    flick: false, seed: rand(0, TAU), grp: -1, ex: 0, ey: 0, delay: 0, tb: 1, sAge: 0, struck: false,
  });
  function burst(x, y, n, speed, cols, main) {
    for (let i = 0; i < n; i++) {
      const z = rand(-1, 1), th = rand(0, TAU), rr = Math.sqrt(1 - z * z);
      const v = speed * rand(0.88, 1.04) * rr;
      const p = mkPart(x, y, Math.cos(th) * v, Math.sin(th) * v, cols[(Math.random() * cols.length) | 0], rand(9, 14) * U, 'fly', main);
      p.flick = Math.random() < 0.3;
      S.parts.push(p);
    }
  }
  function addSpark(x, y, vx, vy, life, sz, spr, drag = 2.2) {
    S.sparks.push({ x, y, vx, vy, age: 0, life, sz, spr, drag });
  }
  function hover(p, dt) {
    const dr = Math.exp(-3 * dt);
    p.vx = p.vx * dr + rand(-1, 1) * 0.1 * D * dt;
    p.vy = p.vy * dr + (rand(-1, 1) * 0.1 - 0.025) * D * dt;
    p.b += (0.42 + 0.12 * Math.sin(p.age * 3 + p.seed) - p.b) * Math.min(1, 3 * dt);
  }
  const TG = [0, 0];
  function updateParts(dt) {
    const ps = S.parts;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      p.age += dt;
      if (p.mode === 'fly') {
        const dr = Math.exp(-2.4 * dt);
        p.vx *= dr;
        p.vy = p.vy * dr + 0.11 * D * dt;
        p.b = 0.34 + 0.66 * Math.exp(-p.age * 1.3);
        if (p.flick && p.age > 1.1 && Math.random() < 0.5) p.b *= 0.25;
      } else if (p.mode === 'hover') {
        hover(p, dt);
      } else if (p.mode === 'seek') {
        p.sAge += dt;
        if (p.sAge < p.delay) {
          hover(p, dt);
        } else {
          targetOf(p, TG);
          const K = p.grp === 2 ? 48 : 16, C = 2 * Math.sqrt(K) * 0.82;
          p.vx += (K * (TG[0] - p.x) - C * p.vx) * dt;
          p.vy += (K * (TG[1] - p.y) - C * p.vy) * dt;
          p.b += (p.tb - p.b) * Math.min(1, 2.5 * dt);
        }
      } else if (p.mode === 'fade') {
        const dr = Math.exp(-1.5 * dt);
        p.vx *= dr;
        p.vy = p.vy * dr - 0.02 * D * dt;
        p.b *= Math.exp(-1.2 * dt);
        if (p.b < 0.02) { ps[i] = ps[ps.length - 1]; ps.pop(); continue; }
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }
  function updateSparks(dt) {
    const a = S.sparks;
    for (let i = a.length - 1; i >= 0; i--) {
      const s = a[i];
      s.age += dt;
      if (s.age >= s.life) { a[i] = a[a.length - 1]; a.pop(); continue; }
      const dr = Math.exp(-s.drag * dt);
      s.vx *= dr;
      s.vy = s.vy * dr + (s.drag ? 0.04 * D * dt : 0);
      s.x += s.vx * dt;
      s.y += s.vy * dt;
    }
  }

  /* ---------- sao băng nhỏ (cuối phim, khi chạm) ---------- */
  function spawnMeteor(x, y) {
    const dir = Math.random() < 0.5 ? -1 : 1, ang = rand(0.35, 0.65);
    if (x == null) { x = rand(0.15, 0.85) * W; y = rand(0.03, 0.3) * H; }
    S.meteors.push({ x, y, dx: Math.cos(ang) * dir, dy: Math.sin(ang), sp: rand(0.85, 1.25) * D, age: 0, life: rand(0.9, 1.3), len: rand(0.18, 0.28) * D });
  }
  function updateMeteors(dt) {
    const a = S.meteors;
    for (let i = a.length - 1; i >= 0; i--) {
      a[i].age += dt;
      if (a[i].age >= a[i].life) { a[i] = a[a.length - 1]; a.pop(); }
    }
  }

  /* ---------- dòng thời gian ---------- */
  const P1 = { x: 0, y: 0 }, P2 = { x: 0, y: 0 }, P3 = { x: 0, y: 0 };

  function boom() {
    S.tB = S.T;
    S.flash = reduce ? 0.45 : 1;
    S.shake = reduce ? 0 : 1;
    S.m.on = false;
    prepareText();
    const n01 = S.text.P[0].length + S.text.P[1].length;
    burst(CX, CY, Math.ceil(n01 * 1.12), 1.05 * D, ['warm', 'gold'], true);
    const sec = Math.round(clamp(n01 * 0.28, 60, 260));
    later(0.42, () => burst(CX - 0.25 * W, CY - 0.17 * H, sec, 0.6 * D, ['rose', 'peach'], false));
    later(0.8, () => burst(CX + 0.26 * W, CY - 0.06 * H, sec, 0.58 * D, ['sky', 'lilac'], false));
    later(1.18, () => burst(CX - 0.04 * W, CY + 0.2 * H, sec, 0.55 * D, ['gold', 'warm'], false));
  }

  function assign() {
    const t = S.text;
    const targets = [];
    for (let g = 0; g < 2; g++) {
      for (const q of t.P[g]) targets.push({ g, ex: q.ex, ey: q.ey, x: (g ? t.xL : t.xN) + S.off + q.ex * t.F });
    }
    const pool = S.parts.filter((p) => p.main);
    for (let i = pool.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
    while (pool.length < targets.length) {
      const p = mkPart(CX + rand(-0.3, 0.3) * D, CY + rand(-0.3, 0.3) * D, 0, 0, 'warm', 10 * U, 'hover', true);
      p.b = 0;
      S.parts.push(p);
      pool.push(p);
    }
    const chosen = pool.slice(0, targets.length);
    const set = new Set(chosen);
    for (const p of S.parts) if (!set.has(p)) p.mode = 'fade';
    chosen.sort((a, b) => a.x + a.seed - (b.x + b.seed));
    targets.sort((a, b) => a.x - b.x);
    const n = targets.length;
    for (let i = 0; i < n; i++) {
      const p = chosen[i], q = targets[i];
      p.mode = 'seek'; p.grp = q.g; p.ex = q.ex; p.ey = q.ey;
      p.sAge = 0; p.delay = 0.55 * (i / n) + rand(0, 0.45); p.tb = 1; p.sz0 = p.sz;
    }
  }

  function textPhases(tb) {
    const t = S.text;
    if (!S.hoverOn && tb >= TL.hover) {
      S.hoverOn = true;
      for (const p of S.parts) if (p.mode === 'fly') p.mode = 'hover';
    }
    if (!S.gatherOn && tb >= TL.gather) { S.gatherOn = true; assign(); }
    S.off = t.off0 * (1 - easeInOut(win(tb, TL.shift, TL.shift + TL.shiftDur)));

    // gạch chữ "lạ": hạt nào bị nét gạch đi qua thì run lên rồi mờ đi
    if (tb >= TL.strike && tb < TL.strike + TL.strikeDur + 0.2) {
      strikePt(easeOut(win(tb, TL.strike, TL.strike + TL.strikeDur)), P3);
      for (const p of S.parts) {
        if (p.grp !== 1 || p.struck) continue;
        targetOf(p, TG);
        if (TG[0] <= P3.x) {
          p.struck = true; p.spr = 'cool'; p.tb = 0.62;
          p.vx += rand(-0.2, 0.2) * t.F;
          p.vy += rand(-0.45, 0.45) * t.F;
        }
      }
    }

    // viết chữ "quen": hạt rơi ra từ đầu ngòi sao
    if (tb >= TL.pen && S.penPtr < S.penT.length) {
      penPt(tb, P3);
      const dot = t.dotEm * t.F;
      while (S.penPtr < S.penT.length) {
        const q = S.penT[S.penPtr];
        if (t.xQ + S.off + q.ex * t.F > P3.x && tb < TL.pen + TL.penDur) break;
        S.penPtr++;
        const p = mkPart(P3.x + rand(-0.05, 0.05) * t.F, P3.y + rand(-0.05, 0.05) * t.F,
          rand(-0.7, 0.7) * t.F, rand(-0.7, 0.7) * t.F, 'peach', dot, 'seek', false);
        p.grp = 2; p.ex = q.ex; p.ey = q.ey;
        S.parts.push(p);
      }
    }
    if (!S.penStar && tb >= TL.pen + TL.penDur + TL.penFly) {
      S.penStar = true;
      const h = penHome(), dx = h.x - CX, dy = h.y - CY;
      stars.push({ r: Math.hypot(dx, dy), th: Math.atan2(dy, dx) - S.skyAngle, sz: 1.9, a: 0.95, tw: 1.4, ph: 0, rgb: 'rgb(255,228,196)', big: true, mine: true });
    }
    if (!S.ended && tb >= TL.end) { S.ended = true; onEnd(); }
  }

  function step(dt) {
    S.clock += dt;
    updateSparks(dt);
    updateMeteors(dt);
    if (!S.started) return;
    S.T += dt;
    const T = S.T, m = S.m;
    for (let i = S.timers.length - 1; i >= 0; i--) {
      if (T >= S.timers[i].t) { const f = S.timers[i].f; S.timers.splice(i, 1); f(); }
    }

    if (!m.arrived && T >= TL.meteorStart) {
      m.on = true;
      m.v = speedAt(m.s);
      m.s += m.v * dt;
      if (m.s >= path.L) { m.s = path.L; m.arrived = true; m.tA = T; }
      m.sn = normAt(m.s);
      m.emit += (20 + 240 * m.sn) * dt;
      if (m.emit >= 1) {
        pathAt(m.s, P1);
        pathAt(m.s - 3, P2);
        let dx = P1.x - P2.x, dy = P1.y - P2.y;
        const dl = Math.hypot(dx, dy) || 1;
        dx /= dl; dy /= dl;
        while (m.emit >= 1) {
          m.emit -= 1;
          const back = rand(0.02, 0.12) * D, side = rand(-0.05, 0.05) * D;
          addSpark(P1.x + rand(-2, 2) * U, P1.y + rand(-2, 2) * U, -dx * back - dy * side, -dy * back + dx * side,
            rand(0.35, 0.9), rand(3, 6) * U, Math.random() < 0.6 ? 'warm' : 'white');
        }
      }
    }

    if (m.on && !m.arrived) S.skySpin = 1.7 * Math.pow(m.sn, 1.5);
    else S.skySpin *= Math.exp(-7 * dt);
    S.skyAngle += S.skySpin * dt;

    // hít vào: ánh sáng bị hút về tâm trước khi nổ
    if (m.arrived && S.tB === Infinity) {
      const k = (T - m.tA) / TL.inhale;
      if (k < 0.8) {
        let n = 110 * dt + Math.random();
        while (n-- >= 1) {
          const a = rand(0, TAU), r = rand(0.12, 0.32) * D, life = 0.3;
          addSpark(CX + Math.cos(a) * r, CY + Math.sin(a) * r, -Math.cos(a) * r / life, -Math.sin(a) * r / life, life, rand(3, 6) * U, 'warm', 0);
        }
      }
      if (k >= 1) boom();
    }

    S.flash *= Math.exp(-3.2 * dt);
    S.shake *= Math.exp(-5 * dt);
    if (S.tB < Infinity) textPhases(T - S.tB);
    updateParts(dt);

    if (S.ended && T >= S.nextAmbient) {
      spawnMeteor();
      S.nextAmbient = T + rand(4.5, 9);
    }
  }

  /* ---------- vẽ ---------- */
  function drawStarHead(x, y, r, a) {
    if (a <= 0.01) return;
    ctx.globalAlpha = a;
    ctx.drawImage(SPR.warm, x - r, y - r, r * 2, r * 2);
    const c = r * 0.45;
    ctx.drawImage(SPR.white, x - c, y - c, c * 2, c * 2);
    const fl = r * (1.05 + 0.12 * Math.sin(S.clock * 9));
    ctx.strokeStyle = 'rgba(255,246,232,0.5)';
    ctx.lineWidth = 0.9 * U;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - fl, y); ctx.lineTo(x + fl, y);
    ctx.moveTo(x, y - fl * 0.8); ctx.lineTo(x, y + fl * 0.8);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawMainMeteor(k) {
    const m = S.m;
    if (!m.on && !(m.arrived && S.tB === Infinity)) return;
    const sn = m.arrived ? 1 : m.sn;
    const v = m.arrived ? speedAt(path.L) : m.v;
    const fadeIn = smooth((S.T - TL.meteorStart) / 0.8);
    const Lt = Math.min((0.17 * D + v * 0.1) * (1 - smooth(k / 0.45)), m.s);
    const col = mix([205, 222, 255], [255, 222, 176], sn);
    ctx.lineCap = 'butt';
    if (Lt > 1) {
      const N = 44;
      pathAt(m.s - Lt, P2);
      for (let i = 1; i <= N; i++) {
        const q = i / N;
        pathAt(m.s - Lt * (1 - q), P1);
        const a = Math.pow(q, 1.7) * fadeIn;
        ctx.beginPath();
        ctx.moveTo(P2.x, P2.y);
        ctx.lineTo(P1.x, P1.y);
        ctx.strokeStyle = `rgba(${col},${(a * 0.13).toFixed(3)})`;
        ctx.lineWidth = (2 + 10 * q) * U;
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,248,236,${(a * 0.95).toFixed(3)})`;
        ctx.lineWidth = (0.35 + 2.6 * q * q) * U;
        ctx.stroke();
        P2.x = P1.x; P2.y = P1.y;
      }
    }
    pathAt(m.s, P1);
    const grow = 1 + 2.4 * smooth(k);
    drawStarHead(P1.x, P1.y, (13 + 20 * sn) * U * grow, fadeIn);
  }

  const buckets = new Map();
  function drawParts() {
    const ps = S.parts, t = S.text;
    if (!ps.length) return;
    buckets.clear();
    const minV2 = 400 * U * U;
    for (const p of ps) {
      if (p.vx * p.vx + p.vy * p.vy < minV2) continue;
      const key = `${p.spr}|${Math.min(4, (p.b * 5) | 0)}`;
      let arr = buckets.get(key);
      if (!arr) buckets.set(key, (arr = []));
      arr.push(p);
    }
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.4 * U;
    for (const [key, arr] of buckets) {
      const [spr, lv] = key.split('|');
      ctx.strokeStyle = `rgba(${RGB[spr]},${(((+lv + 0.6) / 5) * 0.55).toFixed(3)})`;
      ctx.beginPath();
      for (const p of arr) { ctx.moveTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); ctx.lineTo(p.x, p.y); }
      ctx.stroke();
    }
    for (const p of ps) {
      let sz = p.sz, a = p.b;
      if (p.grp >= 0 && t) {
        const k = smooth((p.sAge - p.delay) / 0.9);
        sz = lerp(p.sz0, t.dotEm * t.F, k);
        if (k >= 1) a *= 0.82 + 0.18 * Math.sin(S.clock * (1.2 + (p.seed % 1.6)) + p.seed * 3);
      }
      if (a < 0.01) continue;
      ctx.globalAlpha = Math.min(1, a);
      ctx.drawImage(SPR[p.spr], p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawSparks() {
    for (const s of S.sparks) {
      const a = Math.pow(1 - s.age / s.life, 1.4) * 0.85;
      ctx.globalAlpha = a;
      ctx.drawImage(SPR[s.spr], s.x - s.sz / 2, s.y - s.sz / 2, s.sz, s.sz);
    }
    ctx.globalAlpha = 1;
  }

  function blit(g, x, y, a) {
    if (a <= 0.003) return;
    ctx.globalAlpha = a;
    ctx.drawImage(g.c, x + g.ox, y + g.oy, g.w, g.h);
    ctx.globalAlpha = 1;
  }
  function drawGlyphs(tb) {
    const t = S.text;
    if (!t || !t.G || tb < TL.glyphIn) return;
    const aIn = 0.24 * smooth(win(tb, TL.glyphIn, TL.glyphIn + 1.2));
    const sk = smooth(win(tb, TL.strike, TL.strike + 0.6));
    const qEnd = TL.pen + TL.penDur;
    const aQ = smooth(win(tb, qEnd - 0.3, qEnd + 1.1)) * (0.26 + 0.05 * Math.sin(S.clock * 2.2));
    blit(t.G[0], t.xN + S.off, t.base, aIn);
    blit(t.G[1], t.xL + S.off, t.base, aIn * (1 - 0.45 * sk));
    blit(t.G[2], t.xQ + S.off, t.base, aQ);
  }

  function drawStrike(tb) {
    if (tb < TL.strike) return;
    const t = S.text;
    const sp = easeOut(win(tb, TL.strike, TL.strike + TL.strikeDur));
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,238,220,0.8)';
    ctx.shadowColor = 'rgba(255,190,140,0.8)';
    ctx.shadowBlur = t.F * 0.12;
    ctx.lineWidth = Math.max(1.4, t.F * 0.03);
    ctx.beginPath();
    const N = 24;
    for (let i = 0; i <= N; i++) {
      strikePt((sp * i) / N, P1);
      if (i) ctx.lineTo(P1.x, P1.y); else ctx.moveTo(P1.x, P1.y);
    }
    ctx.stroke();
    ctx.restore();
    const after = tb - (TL.strike + TL.strikeDur);
    if (after < 0) {
      strikePt(sp, P1);
      drawStarHead(P1.x, P1.y, t.F * 0.28, smooth(win(tb, TL.strike - 0.15, TL.strike + 0.05)));
    } else if (after < 0.6) {
      strikePt(1, P1);
      const e = after / 0.6, d = t.F * 1.6 * (1 - Math.pow(1 - e, 2));
      drawStarHead(P1.x + d, P1.y - d * 0.35, t.F * 0.28 * (1 - e * 0.5), 1 - e);
    }
  }

  function drawPen(tb) {
    const t = S.text;
    const t0 = TL.pen - 0.25, t1 = TL.pen + TL.penDur, t2 = t1 + TL.penFly;
    if (tb < t0 || tb > t2) return;
    const r = t.F * 0.26;
    if (tb <= t1) {
      const a = smooth(win(tb, t0, TL.pen));
      for (let i = 9; i >= 1; i--) {
        penPt(tb - i * 0.02, P2);
        ctx.globalAlpha = a * (1 - i / 10) * 0.5;
        const z = r * (1 - i / 14);
        ctx.drawImage(SPR.peach, P2.x - z, P2.y - z, z * 2, z * 2);
      }
      ctx.globalAlpha = 1;
      penPt(tb, P1);
      drawStarHead(P1.x, P1.y, r, a);
    } else {
      // viết xong, ngôi sao nhỏ bay lên thành một vì sao mới trên trời
      penPt(t1, P2);
      const h = penHome(), e = easeInOut(win(tb, t1, t2));
      const x = lerp(P2.x, h.x, e), y = lerp(P2.y, h.y, e) - Math.sin(Math.PI * e) * 0.08 * H;
      drawStarHead(x, y, lerp(r, 13 * U, e), 1 - 0.3 * e);
    }
  }

  function drawMeteors() {
    for (const m of S.meteors) {
      const a = Math.sin(Math.PI * clamp(m.age / m.life, 0, 1));
      const d = m.sp * m.age, hx = m.x + m.dx * d, hy = m.y + m.dy * d;
      const L = Math.min(m.len, d + 1);
      const tx = hx - m.dx * L, ty = hy - m.dy * L;
      const g = ctx.createLinearGradient(tx, ty, hx, hy);
      g.addColorStop(0, 'rgba(200,220,255,0)');
      g.addColorStop(1, `rgba(255,246,232,${(0.9 * a).toFixed(3)})`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6 * U;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(hx, hy);
      ctx.stroke();
      const hs = 9 * U;
      ctx.globalAlpha = a;
      ctx.drawImage(SPR.warm, hx - hs, hy - hs, hs * 2, hs * 2);
      ctx.globalAlpha = 1;
    }
  }

  function drawFlash() {
    if (S.flash < 0.01) return;
    const R = Math.max(W, H) * 0.9;
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);
    g.addColorStop(0, `rgba(255,244,228,${(0.85 * S.flash).toFixed(3)})`);
    g.addColorStop(0.18, `rgba(255,214,170,${(0.35 * S.flash).toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,200,160,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bgc, 0, 0, W, H);
    if (S.shake > 0.02) ctx.translate(rand(-1, 1) * S.shake * 5 * U, rand(-1, 1) * S.shake * 5 * U);
    const m = S.m;
    const k = m.arrived && S.tB === Infinity ? clamp((S.T - m.tA) / TL.inhale, 0, 1) : 0;
    drawStars(1 - 0.4 * smooth(k));
    ctx.globalCompositeOperation = 'lighter';
    const tb = S.T - S.tB;
    if (S.text) drawGlyphs(tb);
    drawParts();
    drawSparks();
    drawMainMeteor(k);
    if (S.text) { drawStrike(tb); drawPen(tb); }
    drawMeteors();
    drawFlash();
    ctx.globalCompositeOperation = 'source-over';
    if (DEBUG) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.fillStyle = '#ff0';
      ctx.font = '12px monospace';
      ctx.fillText(`T=${S.T.toFixed(2)} W=${W} H=${H} s=${S.m.s.toFixed(0)}/${path.L.toFixed(0)} Le=${path.Le.toFixed(0)} k=${path.k.toFixed(2)} arr=${S.m.arrived}`, 6, 14);
    }
  }

  /* ---------- kích thước ---------- */
  function resize() {
    const nw = window.innerWidth, nh = window.innerHeight;
    if (!nw || !nh) return;
    const ocx = CX, ocy = CY, ow = W, oh = H;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = nw; H = nh;
    D = Math.min(W, H);
    U = clamp(D / 420, 0.8, 1.9);
    CX = W / 2;
    CY = H * 0.44;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    bgc.width = cv.width;
    bgc.height = cv.height;
    paintBg();
    if (!stars.length || ow !== W || Math.abs(oh - H) > 0.2 * H) makeStars();
    const oldL = buildPath();
    if (S.m.s > 0 && oldL > 1) S.m.s *= path.L / oldL;
    if (S.text) layoutText();
    if (ow) {
      const dx = CX - ocx, dy = CY - ocy;
      for (const p of S.parts) { p.x += dx; p.y += dy; }
    }
  }
  let rzT = 0;
  window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });

  /* ---------- bắt đầu, kết thúc, chạm ---------- */
  let audio = null;
  function startMusic() {
    if (!CONFIG.music) return;
    try {
      audio = new Audio(CONFIG.music);
      audio.loop = true;
      audio.volume = 0;
      const p = audio.play();
      if (p && p.catch) p.catch(() => {});
      let v = 0;
      const id = setInterval(() => { v = Math.min(0.65, v + 0.02); audio.volume = v; if (v >= 0.65) clearInterval(id); }, 90);
    } catch (e) { /* không phát được nhạc thì thôi */ }
  }
  function start() {
    if (S.started) return;
    S.started = true;
    introEl.classList.add('gone');
    setTimeout(() => { introEl.hidden = true; }, 1200);
    startMusic();
  }
  function onEnd() {
    if (CONFIG.footer) { footerEl.textContent = CONFIG.footer; footerEl.classList.add('show'); }
    later(2.6, () => { hintEl.classList.add('show'); replayEl.classList.add('show'); });
    S.nextAmbient = S.T + 1.6;
  }
  function replay() {
    footerEl.classList.remove('show');
    hintEl.classList.remove('show');
    replayEl.classList.remove('show');
    S = fresh();
    S.started = true;
  }
  window.addEventListener('pointerdown', (e) => {
    if (e.target === replayEl) return;
    if (!S.started) { start(); return; }
    if (!S.ended) return;
    spawnMeteor(e.clientX, e.clientY);
    for (let i = 0; i < 14; i++) {
      const a = rand(0, TAU), v = rand(0.05, 0.22) * D;
      addSpark(e.clientX, e.clientY, Math.cos(a) * v, Math.sin(a) * v, rand(0.4, 0.9), rand(5, 9) * U, 'warm');
    }
    if (!S.tapped) { S.tapped = true; hintEl.classList.remove('show'); }
  });
  introEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); }
  });
  replayEl.addEventListener('click', (e) => { e.stopPropagation(); replay(); });

  /* ---------- vòng lặp ---------- */
  resize();
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    if (!FREEZE) step(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const fontReady = document.fonts && document.fonts.load
    ? Promise.race([document.fonts.load(fontStr(64), CONFIG.words.join(' ')), new Promise((r) => setTimeout(r, 2500))]).catch(() => {})
    : Promise.resolve();

  // Chỉ để xem thử: ?t=15 nhảy tới giây 15, thêm &freeze để đứng hình.
  const qs = new URLSearchParams(location.search);
  if (qs.has('t')) {
    fontReady.then(() => {
      start();
      const target = parseFloat(qs.get('t')) || 0;
      while (S.T < target) step(1 / 60);
      if (qs.has('freeze')) FREEZE = true;
    });
  }
})();
</script>
</body>
</html>
